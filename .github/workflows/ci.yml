name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (static bundle)
        run: docker build -t photoup .

      - name: Install dependencies
        run: docker run --rm -v "$PWD":/app -w /app node:20-alpine npm install

      - name: Type-check
        run: docker run --rm -v "$PWD":/app -w /app node:20-alpine npm run check

      - name: Unit tests
        if: always()
        run: docker run --rm -v "$PWD":/app -w /app node:20-alpine npm run test:unit

  ui-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: UI tests in Docker (mock adapter)
        run: docker compose run --rm playwright
