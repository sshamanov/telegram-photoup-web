services:
  app:
    image: node:20-alpine
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      # Read from the shell environment or ./.env (gitignored). Blank mock flag =
      # auto: real Telegram when credentials are set, mock adapter otherwise.
      VITE_TELEGRAM_API_ID: ${VITE_TELEGRAM_API_ID:-}
      VITE_TELEGRAM_API_HASH: ${VITE_TELEGRAM_API_HASH:-}
      VITE_USE_MOCK_ADAPTER: ${VITE_USE_MOCK_ADAPTER:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    working_dir: /app
    network_mode: host
    volumes:
      - .:/app
    environment:
      PLAYWRIGHT_CONTAINER_MODE: "true"
      PLAYWRIGHT_BASE_URL: "https://localhost:5173"
    depends_on:
      - app
    command: >
      sh -c "
        echo 'waiting for app on 5173...' &&
        timeout 90 bash -c 'until curl -k -s -f https://localhost:5173 >/dev/null; do sleep 2; done' &&
        npx playwright test
      "
